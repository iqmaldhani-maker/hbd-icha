<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ucapan Spesial</title>
<style>
/* =====================================================
   🎨 WARNA BACKGROUND & TEMA (EDIT DI SINI)
   -----------------------------------------------------
   Ganti kode warna di bawah untuk mengubah tema.
   Contoh palet lain (tinggal copy-paste nilainya):

   🌊 Biru laut : --bg1:#2193b0; --bg2:#6dd5ed; --accent:#2193b0; --accent2:#6dd5ed; --kotak1:#e8f8fc; --kotak2:#bfeaf5;
   🌿 Hijau mint: --bg1:#11998e; --bg2:#38ef7d; --accent:#11998e; --accent2:#38ef7d; --kotak1:#e9fbf1; --kotak2:#c4f3d9;
   🌸 Pink soft : --bg1:#ff9a9e; --bg2:#fad0c4; --accent:#f06292; --accent2:#ff9a9e; --kotak1:#fff0f3; --kotak2:#ffd6e0;
   🌙 Ungu gelap: --bg1:#41295a; --bg2:#2f0743; --accent:#8e44ad; --accent2:#c471ed; --kotak1:#f5ecfb; --kotak2:#e0c8f2;
   ===================================================== */
:root {
    --bg1: #ff9966;      /* warna background atas-kiri */
    --bg2: #ff5e62;      /* warna background bawah-kanan */
    --accent: #ff5e62;   /* warna tombol, judul */
    --accent2: #ff9966;  /* warna tombol (gradasi) */
    --kotak1: #fff1e6;   /* warna kotak pesan (gradasi 1) */
    --kotak2: #ffd6c0;   /* warna kotak pesan (gradasi 2) */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
}

.container {
    background: #fff;
    width: 100%;
    max-width: 480px;
    height: min(640px, calc(100dvh - 24px));
    border-radius: 24px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
}

/* ---------- SLIDE ---------- */
.slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    padding: 56px 26px 26px;
    overflow-y: auto;
    animation: slideIn 0.45s ease;
}
.slide.active { display: flex; }

.slide-inner {
    margin: auto 0;              /* otomatis center, aman kalau konten panjang */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateX(40px); }
    to   { opacity: 1; transform: translateX(0); }
}

/* ---------- TEKS ---------- */
h2 { color: var(--accent); text-align: center; font-size: 1.6em; }
.big-emoji { font-size: 3.2em; text-align: center; }
.big-emoji.bounce { animation: bounce 1s ease infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.small-text { text-align: center; color: #555; font-size: 1.1em; line-height: 1.5; }
.hint { text-align: center; color: #999; font-size: 0.9em; }
.question { text-align: center; font-size: 1.4em; font-weight: bold; color: #333; line-height: 1.4; }

.progress {
    position: absolute;
    top: 18px; left: 22px;
    color: #aaa;
    font-size: 0.85em;
}

/* ---------- KOTAK PESAN ---------- */
.message {
    background: linear-gradient(135deg, var(--kotak1) 0%, var(--kotak2) 100%);
    padding: 20px;
    border-radius: 16px;
    line-height: 1.7;
    color: #333;
    width: 100%;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
.message p { margin-bottom: 10px; }
.message p:last-child { margin-bottom: 0; }

/* ---------- FOTO ---------- */
.photo-container {
    width: 170px; height: 170px;
    border-radius: 50%;
    border: 5px solid var(--accent);
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    background: #f0f0f0;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.5em;
}
.photo-container img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- TOMBOL ---------- */
.btn {
    padding: 13px 32px;
    font-size: 1.05em;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: transform 0.25s ease, opacity 0.25s ease;
}
.btn-primary {
    background: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 100%);
    color: #fff;
}
.btn-primary:hover { transform: translateY(-3px); }
.btn-secondary { background: #f0f0f0; color: #555; }
.btn:disabled { opacity: 0.55; cursor: default; transform: none; }

.button-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

.response {
    display: none;
    text-align: center;
    color: var(--accent);
    font-size: 1.1em;
    line-height: 1.5;
    animation: fadeIn 0.4s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.next-hidden { display: none; }

/* ---------- STIKER ---------- */
.sticker {
    position: absolute;
    z-index: 10;
    object-fit: contain;
    pointer-events: none;
    animation: popIn 0.5s ease;
}
@keyframes popIn {
    0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
    60%  { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
}

/* Stiker 1 - slide 3, kanan atas */
.sticker-1 { top: 14px; right: 14px; width: 90px; height: 90px; }

/* Stiker 2 - slide 5, kanan bawah (muncul setelah menjawab) */
.sticker-2 { bottom: 14px; right: 14px; width: 90px; height: 90px; display: none; }
.sticker-2.show { display: block; }

/* Stiker 3 - slide 6, kanan bawah (gambar PNG) */
.sticker-3 { bottom: 14px; right: 14px; width: 110px; height: auto; }

/* ---------- CONFETTI ---------- */
.confetti {
    position: absolute;
    top: -12px;
    width: 10px; height: 10px;
    pointer-events: none;
    animation: fall 3s linear infinite;
}
@keyframes fall {
    0%   { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(700px) rotate(360deg); opacity: 0; }
}

/* ---------- LAYAR KECIL (HP) ---------- */
@media (max-width: 480px) {
    .slide { padding: 52px 18px 20px; }
    h2 { font-size: 1.4em; }
    .photo-container { width: 140px; height: 140px; }
    .question { font-size: 1.2em; }
    .btn { padding: 12px 24px; font-size: 1em; }
    .sticker-1 { width: 64px; height: 64px; top: 10px; right: 10px; }
    .sticker-2 { width: 64px; height: 64px; bottom: 10px; right: 10px; }
    .sticker-3 { width: 80px; bottom: 10px; right: 10px; }
}
</style>
</head>
<body>

<div class="container">

    <!-- ================= SLIDE 1: SAMBUTAN ================= -->
    <section class="slide active" id="slide1">
        <div class="progress">1/6</div>
        <div class="slide-inner">
            <div class="big-emoji bounce">🎉</div>
            <h2 id="judulWelcome"></h2>
            <p class="small-text" id="teksWelcome"></p>
            <p class="hint">Klik tombol di bawah untuk membuka pesannya 👇</p>
            <button class="btn btn-primary" onclick="showSlide(2)">Buka Pesan 💌</button>
        </div>
    </section>

    <!-- ================= SLIDE 2: FOTO ================= -->
    <section class="slide" id="slide2">
        <div class="progress">2/6</div>
        <div class="slide-inner">
            <h2>Ini Kamu Kan? 😊</h2>
            <div class="photo-container">
                <!-- Foto diisi dari CONFIG.fotoTeman di bawah -->
                <span>📷</span>
                <img id="fotoTeman" alt="Foto" style="position:absolute; width:170px; height:170px; object-fit:cover; display:none;">
            </div>
            <div class="message">
                <p style="text-align:center;" id="teksFoto"></p>
            </div>
            <button class="btn btn-primary" onclick="showSlide(3)">Lanjut 👉</button>
        </div>
    </section>

    <!-- ================= SLIDE 3: PESAN PERTAMA + STIKER 1 ================= -->
    <section class="slide" id="slide3">
        <div class="progress">3/6</div>
        <img id="stiker1" class="sticker sticker-1" alt="" style="display:none;">
        <div class="slide-inner">
            <h2>Pesan Pertama</h2>
            <div class="message" id="kotakPesan1"></div>
            <button class="btn btn-primary" onclick="showSlide(4)">Next 🌟</button>
        </div>
    </section>

    <!-- ================= SLIDE 4: PERTANYAAN 1 ================= -->
    <section class="slide" id="slide4">
        <div class="progress">4/6</div>
        <div class="slide-inner">
            <div class="big-emoji" id="emoji4"></div>
            <p class="question" id="tanya4"></p>
            <div class="button-group">
                <button class="btn btn-primary" id="a4" onclick="jawab(4,'a')"></button>
                <button class="btn btn-secondary" id="b4" onclick="jawab(4,'b')"></button>
            </div>
            <p class="response" id="balas4"></p>
            <button class="btn btn-primary next-hidden" id="next4" onclick="showSlide(5)">Lanjut 👉</button>
        </div>
    </section>

    <!-- ================= SLIDE 5: PERTANYAAN 2 (TOMBOL KABUR) + STIKER 2 ================= -->
    <section class="slide" id="slide5">
        <div class="progress">5/6</div>
        <img id="stiker2" class="sticker sticker-2" alt="">
        <div class="slide-inner">
            <div class="big-emoji" id="emoji5"></div>
            <p class="question" id="tanya5"></p>
            <div class="button-group">
                <button class="btn btn-primary" id="a5" onclick="jawab(5,'a')"></button>
                <button class="btn btn-secondary" id="b5" onclick="kabur()"></button>
            </div>
            <p class="response" id="balas5"></p>
            <button class="btn btn-primary next-hidden" id="next5" onclick="showSlide(6)">Lanjut 👉</button>
        </div>
    </section>

    <!-- ================= SLIDE 6: PESAN AKHIR + STIKER 3 ================= -->
    <section class="slide" id="slide6">
        <div class="progress">6/6</div>
        <img id="stiker3" class="sticker sticker-3" alt="" style="display:none;">
        <div class="slide-inner">
            <h2 id="judulAkhir"></h2>
            <div class="message" id="kotakPesanAkhir"></div>
            <p class="hint" style="font-style:italic;" id="dari"></p>
        </div>
    </section>

</div>

<script>
/* =====================================================
   ✏️ BAGIAN YANG WAJIB KAMU EDIT — SEMUA ADA DI SINI
   ===================================================== */
const CONFIG = {

    // 👤 NAMA TEMAN yang diberi ucapan
    namaTeman: "Icha",

    // 🙋 NAMA KAMU (pengirim). Kalau mau anonim tulis "Seseorang"
    namaPengirim: "Iqmal",

    // 🎊 JENIS UCAPAN
    acara: "Selamat Ulang Tahun",

    // 📸 LINK FOTO TEMAN (upload ke Imgur, lalu paste link gambar langsung: https://i.imgur.com/xxxx.jpg)
    // Kosongkan ("") kalau tidak mau pakai foto.
    fotoTeman: "https://i.imgur.com/127WLR7.jpeg",

    // 🖼️ LINK STIKER (GIF / PNG, harus diawali https://)
    // Kosongkan ("") kalau tidak mau pakai stiker tertentu.
    stiker1: "https://i.imgur.com/GANTI_STIKER_1.gif",  // tampil di slide 3 (kanan atas)
    stiker2: "https://i.imgur.com/GANTI_STIKER_2.gif",  // tampil di slide 5 setelah menjawab (kanan bawah)
    stiker3: "https://i.imgur.com/GANTI_STIKER_3.png",  // tampil di slide 6 (kanan bawah)

    // 💬 TEKS SLIDE 1 (sambutan)
    teksWelcome: "Ada pesan spesial buat ICHAAA...",

    // 💬 TEKS SLIDE 2 (di bawah foto)
    teksFoto: "Yeay! Pesan ini memang untuk Icha hukum UGM '26! ✨",

    // 💬 PESAN SLIDE 3 (tiap tanda kutip = 1 paragraf, boleh tambah/kurangi)
    pesan1: [
        "Halo! 👋",
        "Hari ini gue mau menyampaikan sesuatu yang spesial buat temanku.",
        "Semoga Icha selalu sehat dan bahagia terus ya!"
    ],

    // ❓ PERTANYAAN SLIDE 4 (dua pilihan jawaban + balasannya)
    tanya1: {
        emoji: "🎓",
        teks: "gimana kuliah lu cha belakangan ini aman kan?",
        pilihanA: "aman! ✅",
        balasA: "🎉 Alhamdulillah! Pertahankan ya, semangat terus pokonya!",
        pilihanB: "Agak berat 😅",
        balasB: "💪 Gapapa, pelan-pelan aja. lu pasti bisa melewatinya, jalani aja dunianya ini semua!"
    },

    // ❓ PERTANYAAN SLIDE 5 (tombol kedua akan "kabur" saat diklik, lucu-lucuan)
    tanya2: {
        emoji: "😄",
        teks: "Kamu hari ini udah senyum belum?",
        pilihanA: "Udah dong! 😊",
        balasA: "😊 Bagus! Tetap jaga senyum itu ya!",
        pilihanB: "Belum nih... 😔",
        pilihanBTerakhir: "Ya udah deh... 😊",   // teks tombol setelah kabur beberapa kali
        balasB: "😄 Tuh kan, senyum juga akhirnya! Keep smiling ya!"
    },

    // 💬 JUDUL & PESAN TERAKHIR SLIDE 6
    judulAkhir: "Pesan Terakhir 💫",
    pesanAkhir: [
        "Selamat ulang tahun sekali lagi. semoga setelah hari ini, hidupmu menjadi jauh lebih baik! ⭐",
        "Semoga semua cita-citamu tercapai dan Icha selalu dikelilingi orang-orang baik kayak di grup kimpul (kecuali Dyah).",
        "<b>Tetap semangat ya! Icha pasti bisa! 💪✨</b>"
    ]
};

/* =====================================================
   ⚙️ KODE DI BAWAH INI TIDAK PERLU DIEDIT
   ===================================================== */
let currentSlide = 1;
let kaburCount = 0;
let kaburX = 0, kaburY = 0;

function $(id) { return document.getElementById(id); }

function setImage(id, url) {
    const el = $(id);
    if (!url || url.includes("GANTI_")) { el.style.display = "none"; return; }
    el.onerror = () => { el.style.display = "none"; };
    el.src = url;
    el.style.display = "";
}

function isiKonten() {
    $("judulWelcome").textContent = CONFIG.acara + ", " + CONFIG.namaTeman + "!";
    $("teksWelcome").textContent = CONFIG.teksWelcome;
    $("teksFoto").textContent = CONFIG.teksFoto;

    setImage("fotoTeman", CONFIG.fotoTeman);
    setImage("stiker1", CONFIG.stiker1);
    setImage("stiker2", CONFIG.stiker2);
    setImage("stiker3", CONFIG.stiker3);

    $("kotakPesan1").innerHTML = CONFIG.pesan1.map(p => "<p>" + p + "</p>").join("");

    const t1 = CONFIG.tanya1;
    $("emoji4").textContent = t1.emoji;
    $("tanya4").textContent = t1.teks;
    $("a4").textContent = t1.pilihanA;
    $("b4").textContent = t1.pilihanB;

    const t2 = CONFIG.tanya2;
    $("emoji5").textContent = t2.emoji;
    $("tanya5").textContent = t2.teks;
    $("a5").textContent = t2.pilihanA;
    $("b5").textContent = t2.pilihanB;

    $("judulAkhir").textContent = CONFIG.judulAkhir;
    $("kotakPesanAkhir").innerHTML = CONFIG.pesanAkhir.map(p => "<p>" + p + "</p>").join("");
    $("dari").innerHTML = "Dari,<br><b>" + CONFIG.namaPengirim + " 😊</b>";

    document.title = CONFIG.acara + " " + CONFIG.namaTeman;
}

function showSlide(n) {
    $("slide" + currentSlide).classList.remove("active");
    $("slide" + n).classList.add("active");
    currentSlide = n;
    if (n === 6) buatConfetti();
}

function jawab(slide, pilihan) {
    const cfg = slide === 4 ? CONFIG.tanya1 : CONFIG.tanya2;
    const balas = $("balas" + slide);
    balas.textContent = pilihan === "a" ? cfg.balasA : cfg.balasB;
    balas.style.display = "block";

    $("next" + slide).style.display = "block";
    $("a" + slide).disabled = true;
    $("b" + slide).disabled = true;

    if (slide === 5) $("stiker2").classList.add("show");   // stiker 2 muncul setelah menjawab
}

function kabur() {
    const btn = $("b5");
    kaburCount++;

    if (kaburCount >= 5) {          // setelah 4x kabur, tombol akhirnya bisa diklik
        btn.style.transform = "";
        jawab(5, "b");
        return;
    }

    const slide = $("slide5").getBoundingClientRect();
    const b = btn.getBoundingClientRect();
    const targetLeft = slide.left + 10 + Math.random() * Math.max(0, slide.width - b.width - 20);
    const targetTop  = slide.top + 70 + Math.random() * Math.max(0, slide.height - b.height - 140);

    kaburX += targetLeft - b.left;
    kaburY += targetTop - b.top;
    btn.style.transform = "translate(" + kaburX + "px," + kaburY + "px)";

    if (kaburCount === 4) btn.textContent = CONFIG.tanya2.pilihanBTerakhir;
}

function buatConfetti() {
    const slide = $("slide6");
    slide.querySelectorAll(".confetti").forEach(c => c.remove());
    const warna = ["#ff5e62", "#ff9966", "#ffd166", "#06d6a0", "#118ab2", "#c471ed"];
    for (let i = 0; i < 24; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "%";
        c.style.animationDelay = Math.random() * 3 + "s";
        c.style.background = warna[Math.floor(Math.random() * warna.length)];
        slide.appendChild(c);
    }
}

isiKonten();
</script>
</body>
</html>
